name: Build aria2 armeabi-v7a

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  # 唯一的版本集中点：升级时改这一行 + version-check.yml 里的 PINNED
  ARIA2_VER: "1.37.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Android NDK r26d
        run: |
          cd $RUNNER_TEMP
          curl -fSL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q ndk.zip
          echo "NDK=$RUNNER_TEMP/android-ndk-r26d" >> $GITHUB_ENV
          echo "TOOLCHAIN=$RUNNER_TEMP/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64" >> $GITHUB_ENV
          echo "PREFIX=$RUNNER_TEMP/prefix" >> $GITHUB_ENV
          mkdir -p $RUNNER_TEMP/prefix
          # 本步内 $TOOLCHAIN 尚未注入（GITHUB_ENV 下一步才生效），必须用完整路径
          ls $RUNNER_TEMP/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang \
            || { echo "::error::armv7 clang 包装器不存在，NDK 解压异常"; exit 1; }

      - name: Build zlib (static)
        run: |
          cd $RUNNER_TEMP
          curl -fSL -o zlib.tar.gz https://github.com/madler/zlib/archive/refs/tags/v1.3.1.tar.gz
          tar xf zlib.tar.gz
          cd zlib-1.3.1
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_NDK=$NDK \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX=$PREFIX
          cmake --build build --parallel
          cmake --install build
          # 兜底：部分 cmake 版本把静态库命名为 libzlibstatic.a，而链接 -lz 需要 libz.a
          if [ ! -f $PREFIX/lib/libz.a ] && [ -f $PREFIX/lib/libzlibstatic.a ]; then
            mv $PREFIX/lib/libzlibstatic.a $PREFIX/lib/libz.a
          fi
          test -f $PREFIX/lib/libz.a && test -f $PREFIX/include/zlib.h \
            || { echo "::error::libz.a 或 zlib.h 未就位，zlib 构建失败"; exit 1; }

      - name: Build OpenSSL (static)
        run: |
          cd $RUNNER_TEMP
          # 用 GitHub tag 归档而非 openssl.org：后者会把被取代的补丁版挪进 old/ 路径
          curl -fSL -o openssl.tar.gz https://github.com/openssl/openssl/archive/refs/tags/openssl-3.5.8.tar.gz
          tar xf openssl.tar.gz
          cd openssl-openssl-3.5.8
          export ANDROID_NDK_ROOT=$NDK
          export PATH=$TOOLCHAIN/bin:$PATH
          # Nov 10, 2021, openssl fix it. https://github.com/openssl/openssl/pull/15086
          # now we can use -latomic to fix the build error.
          LDFLAGS="-latomic"
          ./Configure android-arm no-shared no-tests no-module -D__ANDROID_API__=24 --prefix=$PREFIX $LDFLAGS
          make -j$(nproc) build_sw
          make install_sw
          test -f $PREFIX/lib/libcrypto.a && test -f $PREFIX/lib/libssl.a \
            || { echo "::error::libcrypto.a / libssl.a 未就位，openssl 构建失败"; exit 1; }

      - name: Build Expat (static)
        run: |
          cd $RUNNER_TEMP
          curl -fSL -o expat.tar.gz https://github.com/libexpat/libexpat/releases/download/R_2_6_2/expat-2.6.2.tar.gz
          tar xf expat.tar.gz
          cd expat-2.6.2
          ./configure \
            --host=arm-linux-androideabi \
            --prefix=$PREFIX \
            --enable-static --disable-shared \
            --without-docbook --without-examples --without-tests \
            CC=$TOOLCHAIN/bin/armv7a-linux-androideabi24-clang \
            CXX=$TOOLCHAIN/bin/armv7a-linux-androideabi24-clang++ \
            AR=$TOOLCHAIN/bin/llvm-ar \
            RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          make -j$(nproc)
          make install
          test -f $PREFIX/lib/libexpat.a && test -f $PREFIX/include/expat.h \
            || { echo "::error::libexpat.a 或 expat.h 未就位，expat 构建失败"; exit 1; }

      - name: Verify install prefix
        run: |
          for lib in libz.a libcrypto.a libssl.a libexpat.a; do
            test -f $PREFIX/lib/$lib || { echo "::error::缺少 $PREFIX/lib/$lib，依赖安装路径偏差"; exit 1; }
          done
          echo "四个静态库全部就位；pkgconfig 目录：$(ls $PREFIX/lib/pkgconfig)"
          $TOOLCHAIN/bin/armv7a-linux-androideabi24-clang --version | head -1

      - name: Get aria2 source
        run: |
          cd $RUNNER_TEMP
          curl -fSL -o aria2.tar.xz \
            https://github.com/aria2/aria2/releases/download/release-$ARIA2_VER/aria2-$ARIA2_VER.tar.xz
          tar xf aria2.tar.xz

      - name: Patch connection limit (16->64, min-split 1M->256K)
        run: |
          cd $RUNNER_TEMP/aria2-$ARIA2_VER
          echo "=== 补丁前（必须存在，否则源码已变更）==="
          grep -n "1, 16, 'x'" src/OptionHandlerFactory.cc || { echo "::error::找不到 16 上限原始代码，aria2 源码结构已变化"; exit 1; }
          grep -n '"1M", 1_m, 1_g' src/OptionHandlerFactory.cc || { echo "::error::找不到 min-split-size 原始代码"; exit 1; }
          sed -i "s/1, 16, 'x'/1, 64, 'x'/" src/OptionHandlerFactory.cc
          # 此模式同时命中 piece-length 同构行，一并放宽属正常且无害
          sed -i 's/"1M", 1_m, 1_g/"1M", 256_k, 1_g/' src/OptionHandlerFactory.cc
          echo "=== 补丁后（必须命中，否则构建中止）==="
          grep -n "1, 64, 'x'" src/OptionHandlerFactory.cc || { echo "::error::连接上限补丁未生效"; exit 1; }
          grep -n '"1M", 256_k, 1_g' src/OptionHandlerFactory.cc || { echo "::error::分片补丁未生效"; exit 1; }

      - name: Configure and build aria2
        run: |
          cd $RUNNER_TEMP/aria2-$ARIA2_VER
          export CC=$TOOLCHAIN/bin/armv7a-linux-androideabi24-clang
          export CXX=$TOOLCHAIN/bin/armv7a-linux-androideabi24-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig
          # 不接 tee/管道：管道会吞掉 configure 的退出码
          ./configure \
            --host=arm-linux-androideabi \
            --disable-nls \
            --with-openssl \
            --with-libexpat \
            --without-gnutls --without-libgcrypt --without-libnettle \
            --without-libxml2 \
            --without-libcares --disable-async-dns \
            --without-sqlite3 --without-libssh2 --without-libgmp \
            CPPFLAGS="-I$PREFIX/include" \
            LDFLAGS="-L$PREFIX/lib -static-libstdc++" \
            ZLIB_CFLAGS="-I$PREFIX/include" \
            ZLIB_LIBS="-L$PREFIX/lib -lz"
          # ===== 静默降级防火墙：三个宏缺任何一个，构建立即红 =====
          grep -q "HAVE_ZLIB" config.h    || { echo "::error::HAVE_ZLIB 未定义：zlib 未启用，HTTP gzip 解压将缺失"; exit 1; }
          grep -q "HAVE_OPENSSL" config.h || { echo "::error::HAVE_OPENSSL 未定义：HTTPS 支持将缺失"; exit 1; }
          grep -q "HAVE_LIBEXPAT" config.h || { echo "::error::HAVE_LIBEXPAT 未定义：XML/Metalink 支持将缺失"; exit 1; }
          make -j$(nproc)
          file src/aria2c

      - name: Strip and package
        run: |
          cd $RUNNER_TEMP/aria2-$ARIA2_VER
          $TOOLCHAIN/bin/llvm-strip src/aria2c
          cp src/aria2c $RUNNER_TEMP/libaria2c.so
          # dynamically linked 属预期：仅动态依赖系统 Bionic（libc/libm/libdl），
          # zlib/openssl/expat/libc++ 全部静态编入；完全静态会使 Android 的 DNS 解析失效
          file $RUNNER_TEMP/libaria2c.so
          file $RUNNER_TEMP/libaria2c.so | grep -q "ARM, EABI5" \
            || { echo "::error::产物不是 32 位 ARM ELF"; exit 1; }
          ls -la $RUNNER_TEMP/libaria2c.so
          sha256sum $RUNNER_TEMP/libaria2c.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libaria2c-armeabi-v7a
          path: ${{ runner.temp }}/libaria2c.so
          if-no-files-found: error
          
